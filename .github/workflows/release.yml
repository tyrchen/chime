name: Release Chime macOS & Prebuilt LoRA Packs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.7.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & uv
        run: |
          rustup toolchain install stable --profile minimal
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run workspace unit tests
        run: cargo test --workspace --all-features

      - name: Build Chime.app installer & public .imepack cartridges
        run: make release-artifacts

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/releases/Chime-*-macos-arm64.pkg
            dist/releases/Chime-*-macos-arm64.zip
            dist/releases/classics-poetry.imepack.zip
            dist/releases/tech-developer.imepack.zip
            dist/releases/SHA256SUMS.txt
