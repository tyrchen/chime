[workspace]
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.15.0"
authors = ["Tian Chen <tyr.chen@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
anyhow = "1.0"
cedarwood = "0.6"
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
flume = "0.12"
memmap2 = "0.9"
mlx-rs = { version = "0.34", features = ["metal", "metal-jit", "safetensors"] }
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
rusqlite = "0.43"
safetensors = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.16", features = ["const_generics", "union"] }
thiserror = "2.0"
toml = "1.2"

# Dev / testing
rstest = "0.29"
tempfile = "3.27"

# Workspace crates
chime-phonetics = { version = "0.15.0", path = "crates/phonetics" }
chime-lexicon = { version = "0.15.0", path = "crates/lexicon" }
chime-neural = { version = "0.15.0", path = "crates/neural" }
chime-decoder = { version = "0.15.0", path = "crates/decoder" }
chime-core = { version = "0.15.0", path = "crates/core" }
